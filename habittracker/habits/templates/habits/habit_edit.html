{% extends "habits/base.html" %}
{% block content %}
<h2>Edit Hbait</h2>

<form method="POST" class="card p-4 shadow-sm">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label">Habit Name</label>
        <input class="form-control" name="name" value="{{ habit.name|default:'' }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea class="form-control" name="description">{{ habit.description|default:'' }}</textarea>
    </div>

    <button class="btn btn-success" type="submit">Save</button>
</form>

{% endblock %}
